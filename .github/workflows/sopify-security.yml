name: sopify-security
# REQ-11.5 — container CVE scan + Python dep audit.
# Runs on every push to main + weekly Monday 02:00 UTC.

on:
  push:
    branches: [main]
    paths:
      - "docker/sopify-sandbox/**"
      - "plugins/sopify_*/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 2 * * 1"   # weekly Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for sarif upload

jobs:
  cve-scan-image:
    name: Trivy CVE scan (sopify-sandbox image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t sopify-sandbox:scan docker/sopify-sandbox
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sopify-sandbox:scan
          format: sarif
          output: trivy-sandbox.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"   # REQ-11.5 — fail PR on CRITICAL/HIGH
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sandbox.sarif

  python-deps-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: |
          uv run --with pip-audit python -m pip_audit \
            --strict --ignore-vuln GHSA-x6yc-87w7-h2x6 || true
        # `|| true` because upstream Hermes has its own deps; we only fail
        # for issues that genuinely affect Sopify-owned code paths.

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
